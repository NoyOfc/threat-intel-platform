# Alembic CLI configuration. The app also runs migrations itself at startup
# (app/db/migrations.py), so the CLI is only needed for authoring revisions:
#   alembic revision --autogenerate -m "describe change"
# The database URL comes from DATABASE_URL (or the app's default), never this file.
[alembic]
script_location = %(here)s/migrations
file_template = %%(rev)s_%%(slug)s
